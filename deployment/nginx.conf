# ==============================================================================
# PlukIt Production Nginx Configuration (F21)
# Domain: plukit.in / www.plukit.in
# Reverse Proxy: Next.js Client (3000) & Express API (4000)
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing and upstream response time
    log_format plukit_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log plukit_combined buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client limits (supports product CSV and invoice uploads up to 10MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream Definitions
    upstream plukit_client {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream plukit_server {
        server 127.0.0.1:4000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP to HTTPS Redirection (Port 80 -> 443)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name plukit.in www.plukit.in api.plukit.in;

        # ACME-challenge for Let's Encrypt / Certbot renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. Main HTTPS Server: Frontend & Unified API Proxy
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name plukit.in www.plukit.in;

        # SSL Certificates (managed via Certbot)
        ssl_certificate /etc/letsencrypt/live/plukit.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/plukit.in/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/plukit.in/chain.pem;

        # SSL Protocols & Ciphers (Modern standard)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com; object-src 'none';" always;

        # Connection concurrency limit
        limit_conn conn_limit 30;

        # ----------------------------------------------------------------------
        # Backend API Proxy (/api/* -> Port 4000)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://plukit_server;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Stricter Rate Limiting on Auth/OTP endpoints
        location ~* ^/api/(auth/send-otp|auth/verify-otp|admin/auth/login) {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://plukit_server;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Generated Invoices static download (/invoices/* -> Server)
        location /invoices/ {
            proxy_pass http://plukit_server/invoices/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Cache-Control "private, no-transform, max-age=86400";
        }

        # ----------------------------------------------------------------------
        # Next.js Static Cache Optimization (/_next/static/*)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://plukit_client;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Next.js Image Optimization cache (/_next/image)
        location /_next/image {
            proxy_pass http://plukit_client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Public static icons, robots.txt, manifest.json
        location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
            proxy_pass http://plukit_client;
            proxy_http_version 1.1;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # Default Client Proxy (Next.js SSR & Pages)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://plukit_client;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Maintenance & Error Pages
        error_page 502 503 504 /maintenance.html;
        location = /maintenance.html {
            root /var/www/plukit/error_pages;
            internal;
        }
    }
}
